server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 4096M;
    server_tokens off;

    # Ensure WebAssembly MIME type is served properly
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny access to dotfiles & private internal directories (mirrors .htaccess)
    location ~ /\. {
        deny all;
        return 403;
    }
    location ~ ^/(storage|config|tests|bin|docker)/ {
        deny all;
        return 403;
    }
    location ~ ^/(config\.php|functions\.php|set_admin_password\.php)$ {
        deny all;
        return 403;
    }

    # SVG anti-XSS CSP
    location ~* \.svgz?$ {
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; plugin-types 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Legacy root endpoint rewrites
    location = /api.php     { rewrite ^ /system/endpoints/api.php last; }
    location = /thumb.php   { rewrite ^ /system/endpoints/thumb.php last; }
    location = /archive.php { rewrite ^ /system/endpoints/archive.php last; }
    location = /export.php  { rewrite ^ /system/endpoints/export.php last; }
    location = /setup       { rewrite ^ /system/endpoints/setup.php last; }

    # Short signed share & export routes
    location ~ ^/s/([A-Za-z0-9_-]{12,128})/?$ {
        rewrite ^/s/([A-Za-z0-9_-]{12,128})/?$ /index.php?share=$1 last;
    }
    location ~ ^/e/([A-Za-z0-9_-]{12,128})/?$ {
        rewrite ^/e/([A-Za-z0-9_-]{12,128})/?$ /system/endpoints/export.php?token=$1 last;
    }

    # Native OS WebDAV Gateway (/dav/)
    location ~ ^/dav(?:/(.*))?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/system/endpoints/dav.php;
        fastcgi_param QUERY_STRING dav_path=$1&$args;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300s;
    }
}
